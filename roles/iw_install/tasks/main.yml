---
- name: Require an installer URL
  ansible.builtin.assert:
    that:
      - iw_install_url | length > 0
    fail_msg: "iw_install_url is required (e.g. iw_version_143_url)."

# Idempotency: skip the download/extract/installer when this role already
# installed the requested version. Deterministic - based on an on-disk marker,
# not on the IceWarp runtime being responsive (it briefly is not right after
# Percona restarts). The 14.4 step is not skipped because it asks for a
# different version.
- name: Check whether IceWarp is already installed
  ansible.builtin.stat:
    path: "{{ iw_tool_cmd }}"
  register: iw_tool_present
  become: true

- name: Check whether this version was already installed
  ansible.builtin.stat:
    path: "{{ iw_install_marker_dir }}/{{ iw_install_version_id }}"
  register: iw_install_marker
  become: true

- name: Decide whether the pinned version must be installed
  ansible.builtin.set_fact:
    iw_install_needed: >-
      {{ not ((iw_tool_present.stat.exists | bool) and (iw_install_marker.stat.exists | bool)) }}

- name: Report the IceWarp install decision
  ansible.builtin.debug:
    msg: >-
      tool={{ iw_tool_present.stat.exists }} marker={{ iw_install_marker.stat.exists }} target={{ iw_install_version_id }}
      -> {{ 'install' if iw_install_needed | bool else 'already installed, skipping installer' }}

- name: Ensure the download and log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ iw_download_dir }}"
    - "{{ iw_log_dir }}"
    - "{{ iw_install_marker_dir }}"
  become: true

- name: Download the IceWarp package for {{ iw_install_version_id }}
  ansible.builtin.get_url:
    url: "{{ iw_install_url }}"
    dest: "{{ iw_download_dir }}/{{ iw_install_url | basename }}"
    mode: "0644"
    timeout: 1800
    checksum: "{{ ('sha256:' ~ iw_install_sha256) if (iw_install_sha256 | length > 0) else omit }}"
  register: iw_pkg_download
  become: true
  when: iw_install_needed | bool

- name: Extract the IceWarp package
  ansible.builtin.unarchive:
    src: "{{ iw_pkg_download.dest }}"
    dest: "{{ iw_download_dir }}"
    remote_src: true
  become: true
  when: iw_install_needed | bool

- name: Derive the extracted package directory
  ansible.builtin.set_fact:
    iw_install_extract_dir: >-
      {{ iw_download_dir }}/{{ (iw_install_url | basename) | regex_replace('(\.tar\.gz|\.tgz|\.tar)$', '') }}
  when: iw_install_needed | bool

- name: Locate the installer script
  # Scope the search to THIS package's extracted directory. iw_download_dir keeps
  # earlier versions too, and a bare recursive find returns the oldest match
  # (e.g. the 14.3 install.sh), which silently re-installs the old version.
  ansible.builtin.find:
    paths: "{{ iw_install_extract_dir }}"
    patterns: install.sh
    recurse: true
    file_type: file
  register: iw_installer_find
  become: true
  when: iw_install_needed | bool

- name: Fail when no installer was found
  ansible.builtin.fail:
    msg: "install.sh not found under {{ iw_install_extract_dir }} after extracting {{ iw_install_url }}"
  when:
    - iw_install_needed | bool
    - iw_installer_find.matched == 0

- name: Record the installer directory
  ansible.builtin.set_fact:
    iw_installer_dir: "{{ iw_installer_find.files[0].path | dirname }}"
  when: iw_install_needed | bool

- name: Locate the internal _install.sh
  ansible.builtin.find:
    paths: "{{ iw_installer_dir }}"
    patterns: _install.sh
    file_type: file
  register: iw_internal_find
  become: true
  when: iw_install_needed | bool

- name: Disable the clean-install guard checks
  ansible.builtin.replace:
    path: "{{ iw_internal_find.files[0].path }}"
    regexp: "{{ item | regex_escape }}"
    replace: "if false; then"
  loop:
    - "{{ icewarp_legacy_config_guard }}"
    - "{{ icewarp_existing_dir_guard }}"
  become: true
  when:
    - iw_install_needed | bool
    - iw_install_patch_guards | bool
    - iw_internal_find.matched > 0

- name: Bypass the WCIS pre-flight gate (test bed only)
  # Build 2784's check_wcis_upgrade() aborts the upgrade when
  # C_WCIS_UpgradeStatus=2 ("warn and require reconfiguration"), which it
  # reports for large WebClient DBs even though the inline migration is exactly
  # what we want to measure. Insert a marker-guarded early return that logs the
  # status/duration it skips. Idempotent: the marker prevents re-patching.
  ansible.builtin.shell: |
    set -e
    f="{{ iw_internal_find.files[0].path }}"
    if grep -q 'TESTBED_WCIS_GATE_BYPASS' "$f"; then
      echo already-patched
      exit 0
    fi
    python3 - "$f" <<'PY'
    import sys
    p = sys.argv[1]
    s = open(p).read()
    old = "check_wcis_upgrade()\n{\n"
    assert old in s, "check_wcis_upgrade() not found in %s" % p
    new = old + (
        '    # TESTBED_WCIS_GATE_BYPASS: skip the WCIS pre-flight gate (large-dataset test)\n'
        '    warn "TESTBED: WCIS gate bypassed (status=$(get_liccheck_variable system C_WCIS_UpgradeStatus), '
        'estimated $(get_liccheck_variable system C_WCIS_UpgradeDuration) min)"\n'
        '    return 0\n'
    )
    open(p, "w").write(s.replace(old, new, 1))
    PY
    echo patched
  args:
    executable: /bin/bash
  register: iw_wcis_patch
  changed_when: "'patched' in (iw_wcis_patch.stdout | default(''))"
  become: true
  when:
    - iw_install_needed | bool
    - iw_install_patch_wcis | bool
    - iw_internal_find.matched > 0

- name: Create the IceWarp service group
  ansible.builtin.group:
    name: "{{ iw_run_as_user }}"
    system: true
  become: true

- name: Create the IceWarp service user and group
  ansible.builtin.user:
    name: "{{ iw_run_as_user }}"
    group: "{{ iw_run_as_user }}"
    system: true
    home: "{{ iw_install_dir }}"
    create_home: false
    shell: /bin/bash
    state: present
  become: true

- name: Install the interactive installer driver
  ansible.builtin.copy:
    src: iw-interactive-install.py
    dest: "{{ iw_install_interactive_driver }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: iw_install_interactive | bool

- name: Run the IceWarp installer in interactive mode (no switches)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ iw_install_interactive_driver }}"
      - "{{ iw_installer_dir }}"
      - "{{ iw_log_dir }}/{{ iw_install_interactive_log_name }}"
  register: iw_install_run_interactive
  changed_when: true
  become: true
  when:
    - iw_install_needed | bool
    - iw_install_interactive | bool

- name: Run the IceWarp installer in automatic mode (capturing stdout+stderr)
  ansible.builtin.shell: |
    set -o pipefail
    sh ./install.sh --auto --skip-api-check --skip-ffmpeg-check \
      --user {{ iw_run_as_user }} --install-dir {{ iw_install_dir }} --start-on-boot 1 \
      2>&1 | tee {{ iw_log_dir }}/{{ iw_install_log_name }}
  args:
    chdir: "{{ iw_installer_dir }}"
    executable: /bin/bash
    stdin: /dev/null
  register: iw_install_run
  changed_when: true
  become: true
  when:
    - iw_install_needed | bool
    - iw_install_tee_log | bool
    - not (iw_install_interactive | bool)

- name: Run the IceWarp installer in automatic mode
  ansible.builtin.command:
    argv:
      - sh
      - ./install.sh
      - --auto
      - --skip-api-check
      - --skip-ffmpeg-check
      - --user
      - "{{ iw_run_as_user }}"
      - --install-dir
      - "{{ iw_install_dir }}"
      - --start-on-boot
      - "1"
    chdir: "{{ iw_installer_dir }}"
    stdin: /dev/null
  register: iw_install_run_plain
  changed_when: true
  become: true
  when:
    - iw_install_needed | bool
    - not (iw_install_tee_log | bool)
    - not (iw_install_interactive | bool)

- name: Record the installer exit status
  ansible.builtin.set_fact:
    iw_install_rc: >-
      {{ iw_install_run.rc if (iw_install_run is defined and iw_install_run.rc is defined)
         else (iw_install_run_plain.rc if (iw_install_run_plain is defined and iw_install_run_plain.rc is defined)
         else (iw_install_run_interactive.rc if (iw_install_run_interactive is defined and iw_install_run_interactive.rc is defined)
         else 'n/a')) }}

- name: Report the installer exit status
  ansible.builtin.debug:
    msg: >-
      install.sh for {{ iw_install_version_id }} exited with rc={{ iw_install_rc }}.
      {% if iw_install_rc not in ['0', 'n/a'] %}
      Non-zero is EXPECTED for the 14.4-over-14.3 step: the installer's
      'wait_database_upgrade "Groupware" "C_GW_UpgradeStatus" … 300' wait can never be satisfied
      (C_GW_UpgradeStatus is 0 when idle and returns to 0 once the fast groupware DB upgrade is
      done), so install.sh warns and exits 3 after 300 s without waiting for the WebClient DB
      migration and without running upgrade.sh. iw_upgrade waits for that migration and runs
      upgrade.sh itself — see {{ iw_log_dir }}/{{ iw_install_log_name }}.
      {% endif %}
  when: iw_install_rc is defined

- name: Fail on a non-zero installer exit status when requested
  ansible.builtin.fail:
    msg: >-
      install.sh for {{ iw_install_version_id }} exited with rc={{ iw_install_rc }}.
      See {{ iw_log_dir }}/{{ iw_install_log_name }}.
      Set iw_install_require_zero_rc=false if this is the known 14.4 'Waiting for Groupware DB' exit 3.
  when:
    - iw_install_require_zero_rc | bool
    - iw_install_rc is defined
    - iw_install_rc not in ['0', 'n/a']

- name: Assert the tool binary is present
  ansible.builtin.stat:
    path: "{{ iw_tool_cmd }}"
  register: iw_tool_stat
  become: true

- name: Fail when installation did not complete
  ansible.builtin.fail:
    msg: >-
      IceWarp {{ iw_tool_cmd }} is missing after installing {{ iw_install_version_id }}.
      See {{ iw_log_dir }}/{{ iw_install_log_name }} and /root/icewarp-install-error.log.
  when: not iw_tool_stat.stat.exists

- name: Record the installed IceWarp version marker
  ansible.builtin.copy:
    content: "{{ iw_install_version_id }}\n"
    dest: "{{ iw_install_marker_dir }}/{{ iw_install_version_id }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: iw_tool_stat.stat.exists

- name: Ensure the IceWarp service user has a login shell
  ansible.builtin.user:
    name: "{{ iw_run_as_user }}"
    shell: /bin/bash
  become: true

- name: Create the IceWarp storage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ iw_run_as_user }}"
    group: "{{ iw_run_as_user }}"
    mode: "0755"
  loop: "{{ iw_storage_paths.values() | list }}"
  become: true
  when: iw_storage_paths | length > 0

- name: Save the installer transcript (non-tee mode)
  ansible.builtin.copy:
    content: "{{ iw_install_run.stdout | default('') }}\n{{ iw_install_run.stderr | default('') }}"
    dest: "{{ iw_log_dir }}/{{ iw_install_log_name }}"
    mode: "0644"
  become: true
  when:
    - not (iw_install_tee_log | bool)
    - iw_install_run is defined

- name: Activate the NFR license
  ansible.builtin.command:
    argv:
      - sh
      - "{{ iw_tool_cmd }}"
      - set
      - system
      - C_OnlineLicense
      - "{{ iw_nfr_license }}"
  changed_when: true
  become: true
  when:
    - iw_install_apply_license | bool
    - iw_nfr_license | length > 0

- name: Start IceWarp
  ansible.builtin.command:
    argv:
      - "{{ iw_icewarpd }}"
      - --restart
      - all
  changed_when: true
  become: true
  when: iw_install_start_services | bool

- name: Record the installed version
  ansible.builtin.command:
    argv:
      - sh
      - "{{ iw_tool_cmd }}"
      - display
      - system
      - c_version
  register: iw_install_version
  changed_when: false
  failed_when: false
  become: true

- name: Show the installed version
  ansible.builtin.debug:
    msg: "IceWarp {{ iw_install_version_id }} -> {{ iw_install_version.stdout | default('n/a') | trim }}"
