---
# Download and run one pinned IceWarp installer. The same role installs 14.3
# (fresh) and runs the 14.4 installer over an existing 14.3 install (upgrade).

iw_install_url: ""
iw_install_version_id: "unknown"
iw_install_sha256: ""

iw_install_dir: /opt/icewarp
iw_run_as_user: icewarp
iw_download_dir: /var/tmp/iw-install
iw_log_dir: /var/log/iw
iw_tool_cmd: "{{ iw_install_dir }}/tool.sh"
iw_icewarpd: "{{ iw_install_dir }}/icewarpd.sh"
iw_nfr_license: ""
iw_storage_paths: {}

# The installer's `if [ -d "$SETUP_INSTALL_DIR" -a "$SETUP_CONFIG_FILE_EXISTS" != "0" ]`
# guard is the upgrade-vs-new-install decision in ask_questions(), not a
# clean-install abort. Rewriting it to `if false` forces "Performing new
# install" (UPGRADE=0), which silently skips applying the 14.4 payload over an
# existing install. With /etc/icewarp/icewarp.conf present, --auto already
# detects the previous install and chooses the upgrade path, so the patch must
# stay off for the 14.4-over-14.3 step. Only enable it to bypass the
# "directory already exists ... information was not found" exit when the config
# file is genuinely absent.
iw_install_patch_guards: false
# TEST BED ONLY: neutralise install.sh's WCIS pre-flight gate. Build 2784 refuses
# to upgrade when C_WCIS_UpgradeStatus=2 ("warn and require reconfiguration"),
# which is what it reports for very large WebClient DBs (e.g. 35 M items /
# ~330 min estimate). The patch makes check_wcis_upgrade() log the status it
# would have blocked on and return, so the migration runs inline. Never use this
# for a production run.
iw_install_patch_wcis: false
iw_install_apply_license: true
iw_install_start_services: true
# Run install.sh in INTERACTIVE mode (no switches) through a pty and answer its
# prompts. Required for upgrade steps: automode exits 3 when the installer's 300 s
# "Waiting for groupware DB" wait expires, whereas interactive mode warns, asks to
# continue and then waits for the database work (see roles/iw_install/files/
# iw-interactive-install.py). Fresh installs can stay on automode.
iw_install_interactive: false
iw_install_interactive_driver: /root/iw-interactive-install.py
iw_install_interactive_log_name: "interactive-{{ iw_install_version_id }}.log"
# install.sh exits non-zero for known-benign upgrade conditions (the 14.4 step exits 3 on the
# 'Waiting for Groupware DB' timeout while the WebClient DB migration is still running in the
# background). A non-zero status is reported; set this true to make it fatal.
iw_install_require_zero_rc: false

# Idempotency marker: one file per installed version, written after a successful
# install. Re-running with the same version skips download/extract/installer.
iw_install_marker_dir: /var/lib/iw-upgrade-test

# Capture stdout+stderr to {{ iw_log_dir }}/{{ iw_install_log_name }} via tee.
iw_install_tee_log: false
iw_install_log_name: "install-{{ iw_install_version_id }}.log"

icewarp_legacy_config_guard: 'if [ -d "$SETUP_INSTALL_DIR" -a "$SETUP_CONFIG_FILE_EXISTS" != "0" ]; then'
icewarp_existing_dir_guard: 'if [ -d "${SETUP_INSTALL_DIR}" ]; then'
