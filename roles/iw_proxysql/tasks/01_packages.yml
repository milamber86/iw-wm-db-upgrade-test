---
# Install exactly ProxySQL {{ proxysql_version }} from the pinned RPM. The 2.4.x
# AlmaLinux 9 repository only carries 2.4.8, and the sha256 pin protects against
# the repository being rebuilt in place.

- name: Ensure the package staging directory exists
  ansible.builtin.file:
    path: "{{ proxysql_rpm_path | dirname }}"
    state: directory
    mode: "0755"
  become: true

- name: Check the installed ProxySQL version
  ansible.builtin.command:
    argv: [rpm, -q, "--qf", "%{VERSION}-%{RELEASE}", "{{ proxysql_package }}"]
  register: proxysql_installed
  changed_when: false
  failed_when: false

- name: Report the installed ProxySQL version
  ansible.builtin.debug:
    msg: "ProxySQL installed: {{ proxysql_installed.stdout | default('none') }} (want {{ proxysql_version }})"

- name: Download the pinned ProxySQL RPM
  ansible.builtin.get_url:
    url: "{{ proxysql_rpm_url }}"
    dest: "{{ proxysql_rpm_path }}"
    mode: "0644"
    timeout: 600
    checksum: "{{ ('sha256:' ~ proxysql_rpm_sha256) if (proxysql_rpm_sha256 | length > 0) else omit }}"
  become: true
  when: not ((proxysql_installed.stdout | default('')) is match('^' ~ (proxysql_version | regex_escape) ~ '(-|$)'))

- name: Install the pinned ProxySQL RPM
  ansible.builtin.dnf:
    name: "{{ proxysql_rpm_path }}"
    state: present
    disable_gpg_check: true
  become: true
  when: not ((proxysql_installed.stdout | default('')) is match('^' ~ (proxysql_version | regex_escape) ~ '(-|$)'))

- name: Confirm ProxySQL is installed at the pinned version
  ansible.builtin.command:
    argv: [rpm, -q, "--qf", "%{VERSION}-%{RELEASE}", "{{ proxysql_package }}"]
  register: proxysql_installed_after
  changed_when: false
  failed_when: false

- name: Require the pinned ProxySQL version
  ansible.builtin.assert:
    that:
      - (proxysql_installed_after.stdout | default('')) is match('^' ~ (proxysql_version | regex_escape) ~ '(-|$)')
    fail_msg: >-
      ProxySQL {{ proxysql_version }} is not installed
      (found '{{ proxysql_installed_after.stdout | default('none') }}').
