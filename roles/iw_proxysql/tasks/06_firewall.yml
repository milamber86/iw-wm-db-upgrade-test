---
- name: Check whether firewalld is active
  ansible.builtin.command: systemctl is-active firewalld
  register: proxysql_fw_active
  changed_when: false
  failed_when: false
  become: true

- name: Allow the ProxySQL MySQL port from the management network
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--add-rich-rule=rule family=\"ipv4\" source address=\"{{ proxysql_firewall_source }}\" port port=\"{{ proxysql_mysql_port }}\" protocol=\"tcp\" accept"
  changed_when: false
  failed_when: false
  become: true
  when: (proxysql_fw_active.stdout | default('')) == 'active'

- name: Reload firewalld after the ProxySQL rule
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  failed_when: false
  become: true
  when: (proxysql_fw_active.stdout | default('')) == 'active'
