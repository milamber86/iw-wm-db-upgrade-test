---
- name: Resolve fast-seed drop-in path
  ansible.builtin.set_fact:
    fast_seed_dropin_path: "{{ mysql_conf_dropin_dir }}/zz-wc-bench-fast-seed.cnf"

- name: Require MySQL drop-in directory
  ansible.builtin.stat:
    path: "{{ mysql_conf_dropin_dir }}"
  register: fast_seed_dropin_dir
  become: true

- name: Fail when MySQL drop-in directory is missing
  ansible.builtin.assert:
    that:
      - fast_seed_dropin_dir.stat.exists | default(false)
      - fast_seed_dropin_dir.stat.isdir | default(false)
    fail_msg: >-
      enable_fast_seed needs a MySQL drop-in directory at {{ mysql_conf_dropin_dir }}.
      Set mysql_conf_dropin_dir (RHEL/Percona: /etc/my.cnf.d, Debian: /etc/mysql/mysql.conf.d)
      or pass -e enable_fast_seed=false.

- name: Ensure my.cnf includes the drop-in directory
  ansible.builtin.lineinfile:
    path: "{{ mysql_cnf_path }}"
    line: "!includedir {{ mysql_conf_dropin_dir }}"
    regexp: '^!includedir\s+{{ mysql_conf_dropin_dir | regex_escape }}/?\s*$'
    backup: true
    insertafter: EOF
  become: true
  register: fast_seed_includedir

- name: Verify my.cnf includes the drop-in directory
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - "^!includedir[[:space:]]+{{ mysql_conf_dropin_dir | regex_escape }}/?[[:space:]]*$"
      - "{{ mysql_cnf_path }}"
  register: fast_seed_includedir_grep
  become: true
  changed_when: false
  failed_when: false

- name: Fail when my.cnf does not include the drop-in directory
  ansible.builtin.assert:
    that:
      - fast_seed_includedir_grep.rc | default(1) | int == 0
    fail_msg: >-
      {{ mysql_cnf_path }} has no !includedir {{ mysql_conf_dropin_dir }}, so
      {{ mysql_conf_dropin_dir }}/zz-wc-bench-fast-seed.cnf would be ignored.
      Add that line or set mysql_cnf_path / mysql_conf_dropin_dir.

- name: Read current log_bin and innodb_doublewrite
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - -e
      - SELECT @@GLOBAL.log_bin, @@GLOBAL.innodb_doublewrite
  register: fast_seed_before_raw
  changed_when: false

- name: Parse current durability settings
  ansible.builtin.set_fact:
    fast_seed_log_bin_before: "{{ fast_seed_before_raw.stdout.split('\t')[0] | trim }}"
    fast_seed_doublewrite_before: "{{ fast_seed_before_raw.stdout.split('\t')[1] | trim }}"

- name: Detect whether fast-seed knobs are already active
  ansible.builtin.set_fact:
    fast_seed_already_active: "{{ (fast_seed_log_bin_before | string | lower) in ['0', 'off'] and (fast_seed_doublewrite_before | string | lower) in ['0', 'off'] }}"

- name: Skip drop-in when skip-log-bin and innodb_doublewrite=OFF are already set
  ansible.builtin.debug:
    msg: >-
      Fast-seed knobs already active (log_bin={{ fast_seed_log_bin_before }},
      innodb_doublewrite={{ fast_seed_doublewrite_before }}). No mysqld restart for apply.
  when: fast_seed_already_active | bool

- name: Write fast-seed MySQL drop-in
  ansible.builtin.copy:
    dest: "{{ fast_seed_dropin_path }}"
    mode: "0644"
    content: |
      # Temporary IceWarp WC benchmark seed shortcut. Removed after LOAD DATA.
      [mysqld]
      skip-log-bin
      innodb_doublewrite=OFF
      innodb_flush_log_at_trx_commit=0
      sync_binlog=0
  become: true
  register: fast_seed_dropin_copy
  when: not (fast_seed_already_active | bool)

- name: Remember whether this play wrote the fast-seed drop-in
  ansible.builtin.set_fact:
    fast_seed_dropin_written: "{{ not (fast_seed_already_active | bool) }}"

- name: Set innodb_fast_shutdown=2 before apply restart
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - -e
      - SET GLOBAL innodb_fast_shutdown=2
  when:
    - not (fast_seed_already_active | bool)
    - fast_seed_dropin_written | bool
  failed_when: false

- name: Restart mysqld to apply fast-seed knobs
  ansible.builtin.systemd:
    name: "{{ mysql_service_name }}"
    state: restarted
  become: true
  when:
    - not (fast_seed_already_active | bool)
    - fast_seed_dropin_written | bool

- name: Wait for mysqld after fast-seed apply
  ansible.builtin.include_tasks: wait_mysqld.yml
  when:
    - not (fast_seed_already_active | bool)
    - fast_seed_dropin_written | bool

- name: Verify skip-log-bin and innodb_doublewrite=OFF
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - -e
      - SELECT @@GLOBAL.log_bin, @@GLOBAL.innodb_doublewrite
  register: fast_seed_after_apply_raw
  changed_when: false
  when: enable_fast_seed | bool

# region agent log
- name: Query concatenated knobs after fast-seed apply
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - -e
      - SELECT CONCAT_WS(',', IFNULL(@@GLOBAL.log_bin,'?'), IFNULL(@@GLOBAL.innodb_doublewrite,'?'), IFNULL(@@GLOBAL.gtid_mode,'?'), IFNULL(@@GLOBAL.log_bin_basename,''), IFNULL(@@GLOBAL.innodb_flush_log_at_trx_commit,'?'), IFNULL(@@GLOBAL.sync_binlog,'?'))
  register: fast_seed_knob_diag
  changed_when: false
  failed_when: false
  when: enable_fast_seed | bool

- name: Diagnose mysqld config after fast-seed apply
  ansible.builtin.shell: |
    set +e
    echo "DROPIN_PATH={{ fast_seed_dropin_path }}"
    echo "DROPIN_EXISTS=$(test -f '{{ fast_seed_dropin_path }}' && echo yes || echo no)"
    echo "===DROPIN==="
    cat '{{ fast_seed_dropin_path }}' 2>&1
    echo "===INCLUDEDIR==="
    grep -hE 'includedir|!include' /etc/my.cnf /etc/mysql/my.cnf /etc/percona-server.conf.d/*.cnf 2>/dev/null
    echo "===CNF_DIRS==="
    ls -la /etc/my.cnf.d /etc/percona-server.conf.d /etc/mysql/mysql.conf.d 2>/dev/null
    echo "===LOG_BIN_IN_CNF==="
    grep -rnhE 'log.bin|skip.log.bin|disable.log.bin|innodb_doublewrite|gtid' /etc/my.cnf /etc/my.cnf.d /etc/percona-server.conf.d /etc/mysql 2>/dev/null | head -80
    echo "===SYSTEMD==="
    systemctl cat '{{ mysql_service_name }}' 2>&1 | head -80
    echo "===PIDS==="
    echo "svc_pid=$(systemctl show '{{ mysql_service_name }}' -p MainPID --value 2>/dev/null)"
    echo "mysqld_pids=$(pidof mysqld 2>/dev/null)"
    echo "===PRINT_DEFAULTS==="
    mysqld --print-defaults 2>/dev/null | tr ' ' '\n' | grep -iE 'log.bin|skip.log|doublewrite|gtid|defaults' | head -40
  args:
    executable: /bin/bash
  register: fast_seed_cfg_diag
  become: true
  changed_when: false
  failed_when: false
  when: enable_fast_seed | bool

- name: Show fast-seed apply diagnosis
  ansible.builtin.debug:
    msg:
      - "knobs_csv={{ fast_seed_knob_diag.stdout | default('') }} verify_raw={{ fast_seed_after_apply_raw.stdout | default('') }} includedir_changed={{ fast_seed_includedir.changed | default(false) }} includedir_line={{ fast_seed_includedir_grep.stdout | default('') }}"
      - "{{ fast_seed_cfg_diag.stdout | default('') }}"
  when: enable_fast_seed | bool

- name: Write fast-seed apply debug log
  ansible.builtin.copy:
    dest: /var/tmp/wc_bench/debug-e9da19-apply.log
    content: "{{ {'sessionId': 'e9da19', 'runId': 'post-fix', 'hypothesisId': 'H1', 'location': 'fast_seed_apply.yml', 'message': 'fast-seed after ensuring !includedir', 'timestamp': (ansible_date_time.epoch | int) * 1000, 'data': {'verify_raw': fast_seed_after_apply_raw.stdout | default(''), 'knobs_csv': fast_seed_knob_diag.stdout | default(''), 'includedir_changed': fast_seed_includedir.changed | default(false), 'includedir_line': fast_seed_includedir_grep.stdout | default(''), 'cfg_diag': (fast_seed_cfg_diag.stdout | default(''))[:4000], 'dropin_path': fast_seed_dropin_path, 'service': mysql_service_name, 'cnf_path': mysql_cnf_path, 'dropin_dir': mysql_conf_dropin_dir}} | to_json }}\n"
  changed_when: false
  failed_when: false
  when: enable_fast_seed | bool

- name: Fetch fast-seed apply debug log
  ansible.builtin.fetch:
    src: /var/tmp/wc_bench/debug-e9da19-apply.log
    dest: "{{ playbook_dir }}/.cursor/debug-e9da19.log"
    flat: true
  failed_when: false
  when: enable_fast_seed | bool
# endregion

- name: Require fast-seed knobs after apply restart
  ansible.builtin.assert:
    that:
      - (fast_seed_after_apply_raw.stdout.split('\t')[0] | trim | string | lower) in ['0', 'off']
      - (fast_seed_after_apply_raw.stdout.split('\t')[1] | trim | string | lower) in ['0', 'off']
    fail_msg: >-
      Fast-seed apply left log_bin={{ fast_seed_after_apply_raw.stdout.split('\t')[0] | default('?') }}
      innodb_doublewrite={{ fast_seed_after_apply_raw.stdout.split('\t')[1] | default('?') }}.
      Check {{ fast_seed_dropin_path }} and mysql_service_name={{ mysql_service_name }}.
  when:
    - enable_fast_seed | bool
    - fast_seed_after_apply_raw is defined
    - fast_seed_after_apply_raw.stdout is defined
    - fast_seed_after_apply_raw.stdout | length > 0
