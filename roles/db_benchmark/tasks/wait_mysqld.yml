---
# region agent log
- name: Diagnose mysqladmin ping
  ansible.builtin.command:
    argv:
      - "{{ mysqladmin_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - ping
  register: wait_adm
  changed_when: false
  failed_when: false

- name: Diagnose mysql SELECT 1
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - -e
      - SELECT 1
  register: wait_sql
  changed_when: false
  failed_when: false

- name: Write wait-probe debug log
  ansible.builtin.shell: |
    python3 -c "
    import json, time, os
    p = {
      'sessionId': 'e9da19',
      'runId': 'wait-mysqld',
      'hypothesisId': 'A',
      'location': 'wait_mysqld.yml',
      'message': 'mysqladmin ping vs mysql SELECT 1',
      'timestamp': int(time.time() * 1000),
      'data': {
        'mysqladmin_bin': '''{{ mysqladmin_bin }}''',
        'mysql_bin': '''{{ mysql_bin }}''',
        'defaults_file': '''{{ mysql_defaults_file }}''',
        'adm_rc': {{ wait_adm.rc | default(-1) | int }},
        'adm_out': '''{{ (wait_adm.stdout | default('') ~ ' ' ~ wait_adm.stderr | default(''))[:400] | regex_replace(\"'\", ' ') }}''',
        'sql_rc': {{ wait_sql.rc | default(-1) | int }},
        'sql_out': '''{{ (wait_sql.stdout | default('') ~ ' ' ~ wait_sql.stderr | default(''))[:400] | regex_replace(\"'\", ' ') }}''',
      },
    }
    path = '/var/tmp/wc_bench/debug-e9da19.log'
    os.makedirs(os.path.dirname(path), exist_ok=True)
    with open(path, 'a') as fh:
      fh.write(json.dumps(p) + '\n')
    "
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Fetch wait diagnosis log
  ansible.builtin.fetch:
    src: /var/tmp/wc_bench/debug-e9da19.log
    dest: "{{ playbook_dir }}/.cursor/debug-e9da19.log"
    flat: true
  failed_when: false
# endregion

- name: Wait until mysqld accepts connections
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - -e
      - SELECT 1
  register: mysql_ping
  until: mysql_ping.rc == 0
  retries: "{{ mysql_restart_wait_retries | default(60) }}"
  delay: "{{ mysql_restart_wait_delay_sec | default(5) }}"
  changed_when: false
