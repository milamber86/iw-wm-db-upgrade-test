---
# region agent log
- name: Diagnose mysqladmin ping
  ansible.builtin.command:
    argv:
      - "{{ mysqladmin_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - ping
  register: wait_adm
  changed_when: false
  failed_when: false

- name: Diagnose mysql SELECT 1
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - -e
      - SELECT 1
  register: wait_sql
  changed_when: false
  failed_when: false

- name: Show wait probe results
  ansible.builtin.debug:
    msg: >-
      adm_rc={{ wait_adm.rc | default(-1) }}
      adm_out={{ wait_adm.stdout | default('') | trim }}
      adm_err={{ wait_adm.stderr | default('') | trim }}
      sql_rc={{ wait_sql.rc | default(-1) }}
      sql_out={{ wait_sql.stdout | default('') | trim }}
      sql_err={{ wait_sql.stderr | default('') | trim }}

- name: Write wait-probe debug log
  ansible.builtin.copy:
    dest: /var/tmp/wc_bench/debug-e9da19.log
    content: "{{ {'sessionId': 'e9da19', 'runId': 'wait-mysqld', 'hypothesisId': 'A', 'location': 'wait_mysqld.yml', 'message': 'mysqladmin ping vs mysql SELECT 1', 'timestamp': (ansible_date_time.epoch | int) * 1000, 'data': {'mysqladmin_bin': mysqladmin_bin, 'mysql_bin': mysql_bin, 'defaults_file': mysql_defaults_file, 'adm_rc': wait_adm.rc | default(-1), 'adm_stdout': wait_adm.stdout | default(''), 'adm_stderr': wait_adm.stderr | default(''), 'sql_rc': wait_sql.rc | default(-1), 'sql_stdout': wait_sql.stdout | default(''), 'sql_stderr': wait_sql.stderr | default('')}} | to_json }}\n"
  changed_when: false
  failed_when: false

- name: Fetch wait diagnosis log
  ansible.builtin.fetch:
    src: /var/tmp/wc_bench/debug-e9da19.log
    dest: "{{ playbook_dir }}/.cursor/debug-e9da19.log"
    flat: true
  failed_when: false
# endregion

- name: Wait until mysqld accepts connections
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - -e
      - SELECT 1
  register: mysql_ping
  until: mysql_ping.rc == 0
  retries: "{{ mysql_restart_wait_retries | default(60) }}"
  delay: "{{ mysql_restart_wait_delay_sec | default(5) }}"
  changed_when: false
