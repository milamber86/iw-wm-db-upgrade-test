---
- name: Check whether optional constraint exists
  ansible.builtin.command:
    argv:
      - "{{ mysql_bin }}"
      - --defaults-extra-file={{ mysql_defaults_file }}
      - --batch
      - --raw
      - --skip-column-names
      - --database
      - "{{ tier_db_name }}"
      - -e
      - >-
        SELECT CONSTRAINT_NAME
        FROM information_schema.TABLE_CONSTRAINTS
        WHERE CONSTRAINT_SCHEMA = '{{ tier_db_name }}'
          AND TABLE_NAME = '{{ mig_stmt.constraint_schema_table }}'
          AND CONSTRAINT_NAME = '{{ mig_stmt.constraint_name }}'
          AND CONSTRAINT_TYPE = 'FOREIGN KEY'
  register: constraint_check
  changed_when: false
  when: mig_stmt.optional | default(false) | bool

- name: Record skipped optional statement
  ansible.builtin.command:
    argv:
      - python3
      - "{{ remote_scripts_dir }}/timed_sql.py"
      - --defaults-extra-file
      - "{{ mysql_defaults_file }}"
      - --database
      - "{{ tier_db_name }}"
      - --mysql-bin
      - "{{ mysql_bin }}"
      - --record-skip
      - --status
      - skipped
      - --step
      - "{{ mig_stmt.step | string }}"
      - --name
      - "{{ mig_stmt.name }}"
      - --sql
      - "{{ mig_stmt.sql | trim }}"
      - --results-file
      - "{{ remote_statements_file }}"
  register: skip_raw
  changed_when: false
  when:
    - mig_stmt.optional | default(false) | bool
    - constraint_check.stdout | default('') | trim | length == 0

- name: Run timed SQL statement
  ansible.builtin.command:
    argv:
      - python3
      - "{{ remote_scripts_dir }}/timed_sql.py"
      - --defaults-extra-file
      - "{{ mysql_defaults_file }}"
      - --database
      - "{{ tier_db_name }}"
      - --mysql-bin
      - "{{ mysql_bin }}"
      - --sql
      - "{{ mig_stmt.sql | trim }}"
      - --tables
      - "{{ (mig_stmt.tables | default([])) | join(',') }}"
      - --results-file
      - "{{ remote_statements_file }}"
      - --step
      - "{{ mig_stmt.step | string }}"
      - --name
      - "{{ mig_stmt.name }}"
      - --session-timeout
      - "{{ mysql_session_timeout_sec | string }}"
  async: "{{ mysql_ddl_timeout_sec | int }}"
  poll: "{{ mysql_ddl_poll_sec | int }}"
  register: timed_raw
  failed_when: (timed_raw.rc | default(1) | int) > 1
  when: >-
    not (
      (mig_stmt.optional | default(false) | bool)
      and (constraint_check.stdout | default('') | trim | length == 0)
    )

- name: Parse timed SQL JSON
  ansible.builtin.set_fact:
    timed_result: "{{ timed_raw.stdout | from_json }}"
  when: timed_raw is not skipped

- name: Recover Step 7 FK type mismatch
  when:
    - timed_raw is not skipped
    - timed_result.status | default('') == 'failed'
    - mig_stmt.name == 'add_fk_snoozed_item_item'
    - fix_fk_type_mismatch | bool
  block:
    - name: Widen snoozed_item_id to BIGINT
      ansible.builtin.command:
        argv:
          - python3
          - "{{ remote_scripts_dir }}/timed_sql.py"
          - --defaults-extra-file
          - "{{ mysql_defaults_file }}"
          - --database
          - "{{ tier_db_name }}"
          - --mysql-bin
          - "{{ mysql_bin }}"
          - --sql
          - ALTER TABLE snoozed_item MODIFY COLUMN snoozed_item_id BIGINT NOT NULL
          - --tables
          - snoozed_item
          - --results-file
          - "{{ remote_statements_file }}"
          - --step
          - "7"
          - --name
          - fix_snoozed_item_id_bigint
          - --session-timeout
          - "{{ mysql_session_timeout_sec | string }}"
      async: "{{ mysql_ddl_timeout_sec | int }}"
      poll: "{{ mysql_ddl_poll_sec | int }}"
      register: fix_type_raw
      failed_when: (fix_type_raw.rc | default(1) | int) > 1

    - name: Retry snoozed_item foreign key
      ansible.builtin.command:
        argv:
          - python3
          - "{{ remote_scripts_dir }}/timed_sql.py"
          - --defaults-extra-file
          - "{{ mysql_defaults_file }}"
          - --database
          - "{{ tier_db_name }}"
          - --mysql-bin
          - "{{ mysql_bin }}"
          - --sql
          - "{{ mig_stmt.sql | trim }}"
          - --tables
          - "{{ (mig_stmt.tables | default([])) | join(',') }}"
          - --results-file
          - "{{ remote_statements_file }}"
          - --step
          - "7"
          - --name
          - add_fk_snoozed_item_item_retry
          - --session-timeout
          - "{{ mysql_session_timeout_sec | string }}"
      async: "{{ mysql_ddl_timeout_sec | int }}"
      poll: "{{ mysql_ddl_poll_sec | int }}"
      register: retry_fk_raw
      failed_when: (retry_fk_raw.rc | default(1) | int) != 0

- name: Fetch statement log to control node
  ansible.builtin.fetch:
    src: "{{ remote_statements_file }}"
    dest: "{{ playbook_dir }}/reports/results_{{ tier_db_name }}_statements_{{ report_stamp }}.json"
    flat: true
  failed_when: false

- name: Fail on non-recoverable SQL error
  ansible.builtin.fail:
    msg: >-
      Step {{ mig_stmt.step }} {{ mig_stmt.name }} failed:
      {{ timed_result.error | default(timed_raw.stderr | default('unknown error')) }}
  when:
    - timed_raw is not skipped
    - timed_result.status | default('') == 'failed'
    - not (mig_stmt.name == 'add_fk_snoozed_item_item' and (fix_fk_type_mismatch | bool))
