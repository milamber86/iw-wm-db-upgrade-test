---
- name: Render markdown report on the database host
  ansible.builtin.template:
    src: report.md.j2
    dest: "{{ resolved_work_dir }}/migration_benchmark_report.md"
    mode: "0644"

- name: Write machine-readable results on the database host
  ansible.builtin.copy:
    content: "{{ benchmark_run | to_nice_json }}\n"
    dest: "{{ resolved_work_dir }}/benchmark_run.json"
    mode: "0644"

- name: Fetch markdown report to control node
  ansible.builtin.fetch:
    src: "{{ resolved_work_dir }}/migration_benchmark_report.md"
    dest: "{{ playbook_dir }}/reports/migration_benchmark_report.md"
    flat: true

- name: Fetch JSON results to control node
  ansible.builtin.fetch:
    src: "{{ resolved_work_dir }}/benchmark_run.json"
    dest: "{{ playbook_dir }}/reports/benchmark_run.json"
    flat: true
