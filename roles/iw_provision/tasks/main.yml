---
# Provision the upgrade test VM through the vpsctl API (role `vps_vm` from
# infralab-hv-orc), then discover its leased IP and add it to the in-memory
# inventory as `iwtarget`.

- name: Validate required provisioning variables
  ansible.builtin.assert:
    that:
      - iw_vm_name | length > 0
      - iw_vm_template | length > 0
      - iw_vm_network | length > 0
      - vps_vm_token | length > 0
    fail_msg: >-
      iw_vm_name/iw_vm_template/iw_vm_network are required and VPSCTL_TOKEN must
      be exported on the control node (bootstrap admin token).

- name: Build the cloud-init payload (adds a password only when configured)
  ansible.builtin.set_fact:
    _iw_cloud_init: >-
      {{ iw_vm_cloud_init | combine({'password': iw_vm_cloud_init_password})
         if (iw_vm_cloud_init_password | length > 0) else iw_vm_cloud_init }}

- name: Look for a cached generated inventory from a previous run
  ansible.builtin.stat:
    path: "{{ iw_generated_inventory }}"
  register: iw_gen_stat
  delegate_to: localhost
  become: false
  when: iw_generated_inventory | length > 0

- name: Create/ensure the VM exists and is running
  ansible.builtin.include_role:
    name: vps_vm
  vars:
    vps_vm_name: "{{ iw_vm_name }}"
    vps_vm_template: "{{ iw_vm_template }}"
    vps_vm_vcpu: "{{ iw_vm_vcpu }}"
    vps_vm_memory_mb: "{{ iw_vm_memory_mb }}"
    vps_vm_disks:
      - { size_gb: "{{ iw_vm_disk_gb }}" }
    vps_vm_nics:
      - { network: "{{ iw_vm_network }}" }
    vps_vm_cloud_init: "{{ _iw_cloud_init }}"
    vps_vm_state: "{{ iw_vm_state }}"
    vps_vm_wait_timeout: "{{ iw_vm_wait_timeout }}"
  when: not (iw_vm_skip_provision | bool)

- name: Read the VM live state to resolve the guest address
  ansible.builtin.uri:
    url: "{{ vps_vm_api_url }}/api/v1/vms/{{ iw_vm_name }}/state"
    method: GET
    headers:
      Authorization: "Bearer {{ vps_vm_token }}"
    status_code: 200
  register: iw_vm_state_raw
  until: >-
    (iw_vm_state_raw.json.leased_ips | default({}) | length > 0)
    or (iw_vm_state_raw.json.reserved_ips | default({}) | length > 0)
  retries: "{{ ((iw_vm_wait_timeout | int) / 10) | int }}"
  delay: 10
  changed_when: false
  when: not (iw_vm_skip_provision | bool)

- name: Resolve the guest IP (leased first, then reserved)
  ansible.builtin.set_fact:
    iw_target_ip: >-
      {{
        (iw_vm_state_raw.json.leased_ips | default({}) | dict2items | map(attribute='value') | list | first)
        if (iw_vm_state_raw.json.leased_ips | default({}) | length > 0)
        else (iw_vm_state_raw.json.reserved_ips | default({}) | dict2items | map(attribute='value') | list | first)
      }}
  when: not (iw_vm_skip_provision | bool)

- name: Load the cached guest IP when provisioning was skipped
  ansible.builtin.include_vars:
    file: "{{ iw_generated_inventory }}"
  when:
    - iw_vm_skip_provision | bool
    - iw_gen_stat.stat.exists | default(false)

- name: Require a usable guest address
  ansible.builtin.assert:
    that:
      - iw_target_ip | default('') | length > 0
    fail_msg: >-
      Could not resolve a guest IP for {{ iw_vm_name }}. The lease may lag boot;
      re-run, or set iw_vm_skip_provision=true with a populated
      {{ iw_generated_inventory }}.

- name: Add the guest to the in-memory inventory as iwtarget
  ansible.builtin.add_host:
    name: "{{ iw_vm_name }}"
    groups: iwtarget
    ansible_host: "{{ iw_target_ip }}"
    ansible_user: "{{ iw_vm_cloud_user }}"

- name: Attach the control-node SSH key to the guest when configured
  ansible.builtin.add_host:
    name: "{{ iw_vm_name }}"
    ansible_ssh_private_key_file: "{{ iw_vm_ssh_key_file }}"
  when: iw_vm_ssh_key_file | length > 0

- name: Persist the generated inventory for re-runs
  ansible.builtin.copy:
    content: |
      ---
      # Auto-generated by roles/iw_provision. Do not edit by hand.
      iw_target_ip: "{{ iw_target_ip }}"
      iw_target_ansible_user: "{{ iw_vm_cloud_user }}"
      iw_target_ssh_key_file: "{{ iw_vm_ssh_key_file }}"
    dest: "{{ iw_generated_inventory }}"
    mode: "0644"
  delegate_to: localhost
  become: false
  when: iw_generated_inventory | length > 0

- name: Report the provisioned guest
  ansible.builtin.debug:
    msg: "{{ iw_vm_name }} is reachable at {{ iw_target_ip }} (user {{ iw_vm_cloud_user }})"
