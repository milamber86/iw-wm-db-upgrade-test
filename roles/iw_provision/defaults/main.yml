---
# Defaults are intentionally minimal — real values come from
# inventory/iwupgrade/group_vars/all.yml. They exist so the role is usable on
# its own and self-documents the expected inputs.

iw_vm_name: iw-wm-upgrade-01
iw_vm_template: tpl_L1_OB_almalinux9.qcow2
iw_vm_network: br0-net
iw_vm_vcpu: 16
iw_vm_memory_mb: 131072
iw_vm_disk_gb: 500
iw_vm_state: started
iw_vm_wait_timeout: 600

iw_vm_cloud_user: root
iw_vm_cloud_init_password: ""
iw_vm_cloud_init:
  user: "{{ iw_vm_cloud_user }}"
  hostname: "{{ iw_vm_name }}"
  ssh_keys: []
iw_vm_ssh_key_file: ""

iw_generated_inventory: "{{ inventory_dir | default('.') }}/generated.yml"
iw_vm_skip_provision: false

vps_vm_api_url: "http://127.0.0.1:8765"
vps_vm_token: "{{ lookup('env', 'VPSCTL_TOKEN') }}"
