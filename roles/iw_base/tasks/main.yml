---
- name: Set the guest hostname
  ansible.builtin.hostname:
    name: "{{ iw_base_hostname }}"
  become: "{{ iw_base_become }}"

- name: Ensure the guest hostname resolves locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ iw_base_hostname | regex_escape }}\s*$'
    line: "127.0.1.1 {{ iw_base_hostname }}"
    state: present
  become: "{{ iw_base_become }}"

- name: Set the timezone
  ansible.builtin.command:
    argv: [timedatectl, set-timezone, "{{ iw_base_timezone }}"]
  changed_when: false
  become: "{{ iw_base_become }}"
  failed_when: false

- name: Install base OS packages
  ansible.builtin.dnf:
    name: "{{ iw_base_packages }}"
    state: present
  become: "{{ iw_base_become }}"

# The vpsctl overlay is provisioned at iw_vm_disk_gb, but the AlmaLinux template
# ships a small (35G) LVM root. Grow the partition, PV and LV to use the whole
# disk so restored production data fits. Idempotent: a second run is a no-op.
- name: Extend the root partition, LVM and filesystem to fill the disk
  ansible.builtin.shell: |
    set -euo pipefail
    ROOT_SRC=$(findmnt -n -o SOURCE /)
    if ! lvs "$ROOT_SRC" >/dev/null 2>&1; then
      echo "status=not-lvm (root filesystem is not LVM-backed; skipping)"
      exit 0
    fi
    VG=$(lvs --noheadings -o vg_name "$ROOT_SRC" | xargs)
    PV=$(pvs --noheadings -o pv_name --select "vg_name=$VG" | xargs | awk '{print $1}')
    PARTNUM_FILE="/sys/class/block/$(basename "$PV")/partition"
    DISK="/dev/$(lsblk -nd -o pkname "$PV" | xargs)"
    CHANGED=0

    if [ -f "$PARTNUM_FILE" ]; then
      PARTNUM=$(cat "$PARTNUM_FILE")
      if growpart "$DISK" "$PARTNUM" >/tmp/iw-growpart.out 2>&1; then
        CHANGED=1
      elif grep -q NOCHANGE /tmp/iw-growpart.out; then
        :
      else
        cat /tmp/iw-growpart.out
        exit 1
      fi
    fi

    pvresize "$PV" >/dev/null

    FREE=$(vgs --noheadings --units b --nosuffix -o vg_free "$VG" | xargs | cut -d. -f1)
    if [ "${FREE:-0}" -gt 0 ]; then
      lvextend -l +100%FREE "$ROOT_SRC" >/dev/null
      CHANGED=1
    fi

    FSTYPE=$(findmnt -n -o FSTYPE /)
    if [ "$FSTYPE" = "xfs" ]; then
      xfs_growfs / >/dev/null
    elif [ "$FSTYPE" = "ext4" ]; then
      resize2fs "$ROOT_SRC" >/dev/null
    fi

    if [ "$CHANGED" = "1" ]; then
      echo "status=extended"
    else
      echo "status=unchanged"
    fi
    echo "root filesystem size: $(df -h --output=size / | tail -1 | tr -d ' ')"
  args:
    executable: /bin/bash
  register: iw_base_rootfs
  changed_when: "'status=extended' in iw_base_rootfs.stdout"
  become: "{{ iw_base_become }}"

- name: Report the root filesystem size
  ansible.builtin.debug:
    msg: "{{ iw_base_rootfs.stdout | default('') | trim | split('\n') }}"

- name: Raise TCP listen/SYN backlog for IceWarp
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-iw-upgrade.conf
    mode: "0644"
    content: |
      # IceWarp upgrade test bed.
      net.core.somaxconn = 4096
      net.ipv4.tcp_max_syn_backlog = 8192
      vm.swappiness = 10
  become: "{{ iw_base_become }}"
  register: iw_base_sysctl

- name: Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: iw_base_sysctl is changed
  become: "{{ iw_base_become }}"

- name: Put SELinux in permissive mode (config)
  ansible.builtin.lineinfile:
    path: /etc/selinux/config
    regexp: '^SELINUX='
    line: 'SELINUX=permissive'
    state: present
  become: "{{ iw_base_become }}"
  failed_when: false

- name: Put SELinux in permissive mode (runtime)
  ansible.builtin.command: setenforce 0
  changed_when: false
  become: "{{ iw_base_become }}"
  failed_when: false

- name: Ensure IceWarp storage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ iw_run_as_user }}"
    group: "{{ iw_run_as_user }}"
    mode: "0755"
  loop: "{{ iw_storage_paths.values() | list if iw_storage_paths is mapping else iw_storage_paths }}"
  become: "{{ iw_base_become }}"
  failed_when: false

- name: Start and enable firewalld
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true
  become: "{{ iw_base_become }}"
  failed_when: false

- name: Check whether firewalld is active
  ansible.builtin.command: systemctl is-active firewalld
  register: iw_base_fw_active
  changed_when: false
  become: "{{ iw_base_become }}"
  failed_when: false

- name: Open IceWarp service ports
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, "--add-port={{ item }}/tcp"]
  loop: "{{ iw_firewall_ports }}"
  changed_when: false
  become: "{{ iw_base_become }}"
  failed_when: false
  when: (iw_base_fw_active.stdout | default('')) == 'active'

- name: Reload firewalld after port changes
  ansible.builtin.command: firewall-cmd --reload
  changed_when: false
  become: "{{ iw_base_become }}"
  failed_when: false
  when: (iw_base_fw_active.stdout | default('')) == 'active'
