---
# Inventory for the IceWarp 14.3 -> 14.4 upgrade test bed.
#
#   ansible-playbook -i inventory/iwupgrade playbooks/iw-upgrade-site.yml
#
# - `hypervisors` is the Infralab hypervisor. The provisioning role talks to the
#   vpsctl API over 127.0.0.1:8765 on that host, so no API port is exposed.
# - `prod` is the production IceWarp host that serves the `.sql.gz` backups. The
#   control node connects to it only to add/remove the ephemeral SSH firewall
#   exception (delegated firewall tasks). The actual dump transfer runs from the
#   guest (`iwtarget`) and reaches prod NATed as the hypervisor public IP.
# - `iwtarget` is empty here: the guest is created by the provisioning play and
#   added at runtime with `add_host` (see inventory/iwupgrade/.generated.yml for
#   re-runs).

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
  children:
    hypervisors:
      hosts:
        hypervisor:
          ansible_host: "{{ hypervisor_ip }}"
          ansible_user: "{{ hypervisor_user | default('root') }}"
    production:
      hosts:
        prod:
          ansible_host: "{{ prod_ssh_host }}"
          ansible_user: "{{ prod_ssh_user | default('root') }}"
          # Optional: control-node access to prod for the firewall tasks only.
          ansible_ssh_private_key_file: "{{ prod_ssh_private_key_file | default('') }}"
          # Real hosts grant the login user passwordless root only via a
          # command allow-list (e.g. NOPASSWD: /bin/su, /usr/bin/sudo, /bin/bash),
          # not for arbitrary sudo commands. Running become through /bin/bash
          # makes `sudo -n /bin/bash -c ...` match that allow-list, so the
          # delegated firewall tasks elevate without a sudo password.
          ansible_shell_executable: /bin/bash
          ansible_become_method: sudo
    iwtarget:
      hosts: {}
    # Source host for the 14.2 -> 14.3 -> 14.4 chain test
    # (playbooks/iw-upgrade-chain.yml). Used only for the delegated firewall
    # tasks; the dumps are pulled from the guest. Login as beranek, root via
    # `sudo -n /bin/bash` (same allow-list as the other real hosts).
    tp1src:
      hosts:
        tp1:
          ansible_host: "tp1.onice.io"
          ansible_user: "beranek"
          ansible_ssh_private_key_file: "{{ onice_ssh_private_key_file | default('~/.ssh/id_ecdsa') }}"
          ansible_shell_executable: /bin/bash
          ansible_become_method: sudo
    # Hosts probed read-only by playbooks/iw-db-probe.yml (roles/iw_dbprobe).
    # `production` is a child so the real servers are probed too; `onice` is the
    # test cloud server, reached directly as root.
    probes:
      children:
        production:
      hosts:
        onice:
          ansible_host: "icewarp.onice.io"
          ansible_user: root
          ansible_ssh_private_key_file: "{{ onice_ssh_private_key_file | default('~/.ssh/id_ecdsa') }}"
          # Already root: do not try to sudo.
          iw_dbprobe_become: false
