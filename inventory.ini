# IceWarp WC DB migration benchmark inventory.
# The inventory host IS the MySQL server (SSH + local mysql CLI).
# Replace CHANGE_ME values before running.

[mysql]
db-server ansible_host=CHANGE_ME

[mysql:vars]
ansible_user = root
ansible_python_interpreter = python3

# MySQL client connection (used by mysql CLI on this host)
mysql_host = 127.0.0.1
mysql_port = 3306
mysql_user = root
mysql_password = CHANGE_ME
# Uncomment to use a UNIX socket instead of TCP:
# mysql_socket = /var/run/mysqld/mysqld.sock
