---
# Read-only probe of IceWarp databases and the newest backups.
#
#   ansible-playbook -i inventory/iwupgrade playbooks/iw-db-probe.yml
#   ansible-playbook -i inventory/iwupgrade playbooks/iw-db-probe.yml --limit onice
#   ansible-playbook -i inventory/iwupgrade playbooks/iw-db-probe.yml -e iw_dbprobe_row_count_mode=exact
#
#   # Real host list (operator `beranek` + sudo, see inventory/group_vars/all.yml)
#   ansible-playbook -i inventory/iwcloudlist_all.ini playbooks/iw-db-probe.yml \
#     -e iw_dbprobe_targets='canary_group_1:canary_group_2:canary_group_3:canary_group_4:canary_group_5:canary_group_6'
#
# For every targeted host it writes one JSON report under reports/ and then a
# combined overview (Markdown + JSON) that ranks the instances by the largest
# table row count and the largest table data size in each IceWarp database.
# Nothing is written to the probed hosts; only read-only SQL runs.

- name: Probe IceWarp databases and backups (read-only)
  hosts: "{{ iw_dbprobe_targets | default('probes') }}"
  gather_facts: false
  roles:
    - role: iw_dbprobe
