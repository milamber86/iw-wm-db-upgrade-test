---
# Install only: provision the IceWarp upgrade test VM and install the base OS,
# Percona MySQL 8 and IceWarp 14.3 on it. This is plays (a) and (b) of
# playbooks/iw-upgrade-site.yml without the production restore, validation and
# 14.4 upgrade (those need the vault and confirm_prod_transfer).
#
#   export VPSCTL_TOKEN=...
#   ansible-playbook -i inventory/iwupgrade playbooks/iw-install.yml

- name: Provision the IceWarp upgrade test VM
  hosts: hypervisors
  gather_facts: false
  roles:
    - role: iw_provision

- name: Base OS, Percona MySQL and IceWarp 14.3
  hosts: iwtarget
  gather_facts: true
  roles:
    - role: iw_base
    - role: mysql_fastload
    - role: iw_install
      vars:
        iw_install_url: "{{ iw_version_143_url }}"
        iw_install_version_id: "{{ iw_version_143 }}"
        iw_install_sha256: "{{ iw_pkg_sha256_143 }}"
        iw_install_apply_license: true
        iw_install_start_services: true
        iw_install_tee_log: true
        iw_install_log_name: "install-14.3.log"
    - role: iw_webclient
    - role: iw_mon
