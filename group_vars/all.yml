---
# Target row counts. Override at the CLI, for example:
#   ansible-playbook site.yml -e '{"row_counts": [10000000]}'
#   ansible-playbook site.yml -e row_count_preset=10m
# Known scales: 1m (1e6), 3m (3e6), 5m (5e6), 10m (1e7), 15m (1.5e7), 20m (2e7), 30m (3e7), 50m (5e7), 100m (1e8), 500m (5e8), 1b (1e9)
row_counts:
  - 1000000
  - 100000000
  - 1000000000

# Optional preset: 1m | 3m | 5m | 10m | 15m | 20m | 30m | 50m | 100m | 500m | 1b | all (empty = use row_counts as-is)
row_count_preset: ""

# 1B tier refuses to run unless explicitly confirmed (disk + multi-day DDL).
confirm_1b: false

# Bulk load
batch_size: 250000
seed_workers: 4
accounts_per_million: 100
folders_per_account: 10
snooze_rate: 0.001
seed_rng_seed: 42

# Staging for TSV + scripts. "auto" = @@secure_file_priv/wc_bench, else /var/tmp/wc_bench
staging_dir: auto

# Drop the test database after metrics are captured so later tiers can reuse disk.
keep_database: false

# Opt-in GLOBAL InnoDB tunables during LOAD DATA (always restored afterwards).
# No mysqld restart. Use when enable_fast_seed=false but you still want flush/sync shortcuts.
# Affects the whole MySQL instance — leave false on shared servers.
enable_load_tuning: false
load_tuning_innodb_flush_log_at_trx_commit: 0
load_tuning_sync_binlog: 0

# Restart mysqld around LOAD DATA with skip-log-bin and innodb_doublewrite=OFF (and
# flush_log_at_trx_commit=0 / sync_binlog=0). Restored before ANALYZE and ALTER timings.
# Affects the whole instance. Default on; disable on replica/cluster hosts:
#   ansible-playbook site.yml -e enable_fast_seed=false
enable_fast_seed: true
mysql_service_name: mysql
mysql_cnf_path: /etc/my.cnf
# RHEL/Percona: /etc/my.cnf.d   Debian/Ubuntu: /etc/mysql/mysql.conf.d
mysql_conf_dropin_dir: /etc/my.cnf.d
mysqladmin_bin: mysqladmin

# Add the production snoozed_item FK on the empty schema (before LOAD DATA)
# so Step 2 DROP FOREIGN KEY is a real timed operation. Do not add FKs after load
# or add FK_item_folder (the migration ADDs that during the combined item ALTER).
apply_source_fks_after_seed: true

# Disk preflight: require free bytes >= rows * this * 2.5 (COPY ALTER duplicates the table).
bytes_per_item_estimate: 2048
skip_disk_check: false

# Async timeout for long ALTER / DELETE (seconds). Default 3 days.
mysql_ddl_timeout_sec: 259200
mysql_ddl_poll_sec: 30
mysql_retries: 8

# If a tier fails, continue with the next row count (report still written).
continue_on_tier_failure: false

# Never used as a target; documented so inventory mistakes are obvious.
forbidden_databases:
  - dbiwc127wc
  - mysql
  - sys
  - information_schema
  - performance_schema
